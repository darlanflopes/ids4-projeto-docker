services:
  ids-analiser:
    build: .
    container_name: ids_suricata_tcpdump
    # O comando tail -f mantém o container rodando em segundo plano para você poder acessá-lo e testar as ferramentas
    command: tail -f /dev/null
    cap_add:
      - NET_ADMIN
    networks:
      - ids-net

networks:
  ids-net:
    driver: bridge